[project]
name = "bern_financial_data"
version = "0.1.0"
description = "桌面金融数据中台 — 本地化、增量更新、多项目复用"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "akshare>=1.18",
    "tushare>=1.4",
    "pandas>=3.0",
    "SQLAlchemy>=2.0",
    "FastAPI>=0.140",
    "uvicorn>=0.51",
    "APScheduler>=3.10",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
