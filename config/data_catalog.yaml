  - name: "股票数据"
    icon: "chart"
    schedule_enabled: false
    children:
      - name: "A股日线行情"
        source_key: "stock.a_daily"
        api_source: "akshare"
        api_function: "stock_zh_a_hist"
        table_name: "stock_daily"
        has_incremental: true
        incremental_field: "date"
        params_template:
          symbol:
            type: "text"
            label: "股票代码"
            default: "000001"
          period:
            type: "select"
            label: "周期"
            options: ["daily", "weekly", "monthly"]
            default: "daily"
          start_date:
            type: "date"
            label: "开始日期"
            default_years: -3
          end_date:
            type: "date"
            label: "结束日期"
            default: "today"
          adjust:
            type: "select"
            label: "复权"
            options: ["", "qfq", "hfq"]
            default: ""

  - name: "指数数据"
    icon: "trending_up"
    schedule_enabled: false
    children:
      - name: "指数日线"
        source_key: "index.daily"
        api_source: "akshare"
        api_function: "stock_zh_index_daily"
        table_name: "index_daily"
        has_incremental: true
        incremental_field: "date"
        params_template:
          symbol:
            type: "text"
            label: "指数代码"
            default: "sh000001"
          start_date:
            type: "date"
            label: "开始日期"
            default_years: -1
          end_date:
            type: "date"
            label: "结束日期"
            default: "today"

  - name: "基金数据"
    icon: "account_balance"
    schedule_enabled: false
    children:
      - name: "ETF基金日线"
        source_key: "fund.etf_daily"
        api_source: "akshare"
        api_function: "fund_etf_hist_em"
        table_name: "fund_etf_daily"
        has_incremental: true
        incremental_field: "date"
        # 需要精确代码（默认 510050 上证50ETF），缺代码时查询/同步会被拦截
        params_template:
          code:
            type: "text"
            label: "基金代码"
            default: "510050"
            placeholder: "请输入基金代码，如 510050"
          start_date:
            type: "date"
            label: "开始日期"
            default_years: -1
          end_date:
            type: "date"
            label: "结束日期"
            default: "today"
