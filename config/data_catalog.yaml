- name: 股票数据
  icon: chart
  schedule_enabled: false
  children:
  - name: A股日线行情
    source_key: stock.a_daily
    health_check_ignore: true   # 需手动输入 symbol 按需拉取，表级新鲜度无意义，健康检查静默
    api_source: akshare
    api_function: stock_zh_a_hist
    table_name: stock_daily
    # 复权因子归属：查询端 /data/stock_daily?adj=qfq|hfq 走此因子表派生
    adj_factor_asset_type: stock
    adj_factor_table: asset_adj_factor
    has_incremental: true
    incremental_field: date
    # 统一中文列 → 规范英文列（与 CSV 导入的表头一致），并注入 symbol 列
    column_map:
      日期: date
      股票代码: symbol
      开盘: open
      收盘: close
      最高: high
      最低: low
      成交量: volume
      成交额: amount
    code_column: symbol
    params_template:
      symbol:
        type: text
        label: 股票代码
        default: '000001'
      period:
        type: select
        label: 周期
        options:
        - daily
        - weekly
        - monthly
        default: daily
      start_date:
        type: date
        label: 开始日期
        default_years: -3
      end_date:
        type: date
        label: 结束日期
        default: today
      adjust:
        type: select
        label: 复权
        options:
        - ''
        - qfq
        - hfq
        default: ''
- name: 指数数据
  icon: trending_up
  schedule_enabled: false
  children:
  - name: 指数日线
    source_key: index.daily
    api_source: akshare
    api_function: stock_zh_index_daily
    table_name: index_daily
    has_incremental: true
    incremental_field: date
    params_template:
      symbol:
        type: text
        label: 指数代码
        default: sh000001
      start_date:
        type: date
        label: 开始日期
        default_years: -1
      end_date:
        type: date
        label: 结束日期
        default: today
- name: 基金数据
  icon: account_balance
  schedule_enabled: false
  children:
  - name: ETF基金日线
    source_key: fund.etf_daily
    api_source: tushare
    api_function: fund_daily
    table_name: fund_etf_daily
    # 复权因子归属：查询端 /data/fund_etf_daily?adj=qfq|hfq 走此因子表派生
    adj_factor_asset_type: fund
    adj_factor_table: asset_adj_factor
    # 数据使用警告：GUI 加载该表时顶部黄色警告条展示（见 docs/DATA_GOVERNANCE.md §5）
    data_warning: "2005-2017 含封闭式基金/LOF，按 ETF 口径统计时需过滤"
    has_incremental: true
    incremental_field: date
    # tushare fund_daily 返回 YYYYMMDD 日期，需按此格式传 start/end
    date_format: '%Y%m%d'
    # 统一列 → 规范英文列（保留 OHLC+amount+date+volume，丢弃 ts_code/pre_close/change/pct_chg）。
    # 注意：ts_code 不映射到 code —— code 列由 sync_engine 注入去后缀的纯数字，
    # 与 CSV 导入的 code=159001 一致，按 (code,date) 合并去重。
    column_map:
      trade_date: date
      open: open
      high: high
      low: low
      close: close
      vol: volume
      amount: amount
    code_column: code
    params_template:
      ts_code:
        type: text
        label: 基金代码
        default: '159001.SZ'
        placeholder: 请输入基金代码，如 159001 或 159001.SZ
      start_date:
        type: date
        label: 开始日期
        default_years: -1
      end_date:
        type: date
        label: 结束日期
        default: today
- name: 复权因子
  icon: swap_horiz
  schedule_enabled: false
  children:
  - name: A股复权因子
    source_key: factor.stock
    api_source: tushare
    api_function: adj_factor
    table_name: asset_adj_factor
    asset_type: stock
    sync_mode: batch
    has_incremental: true
    incremental_field: date
    date_format: '%Y%m%d'
    code_column: code
    health_check_ignore: true   # 因子新鲜度不单独告警（随行情主表反映）
  - name: ETF复权因子
    source_key: factor.fund
    api_source: tushare
    api_function: fund_adj
    table_name: asset_adj_factor
    asset_type: fund
    sync_mode: batch
    # tushare fund_adj 权限不足时回退 akshare fund_etf_hist_em 反推因子
    fallback_api_source: akshare
    fallback_api_function: fund_etf_hist_em
    has_incremental: true
    incremental_field: date
    date_format: '%Y%m%d'
    code_column: code
    health_check_ignore: true
