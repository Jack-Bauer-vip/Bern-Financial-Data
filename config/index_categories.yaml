# 指数分类（理杏仁式）配置
#
# 用途：看板指数 tab 分类筛选 chip + API `/api/v1/indices`。
# 分类逻辑在 src/core/index_categories.py（纯函数，可单测）。
# 生成脚本：python scripts_gen/sync_index_category.py → 幂等写 meta_index_category。
#
# 数据来源三路：
#   manual —— 手动精修（主流指数，优先于自动分类）
#   auto   —— 自动分类（宽基全名白名单 + 名称关键词启发式，src/core/index_categories.py）
#   global —— 跨境/QDII 策划清单（分类与行情数据解耦：即使行情未入库也能先分类）
#
# 分类固定顺序 = 看板 chip 顺序。

categories:
  - 宽基
  - 行业
  - 主题
  - 风格
  - 策略
  - 债券
  - 跨境
  - 其他

