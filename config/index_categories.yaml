# ---------------------------------------------------------------------------
# 跨境/QDII 指数（全手动策划；分类与行情数据解耦）
#
# api_function：行情取数函数（akshare）。
#   stock_hk_index_daily_sina —— 港股日线（新浪，已测可用：HSI/HSCEI/HSTECH…）
#   index_global_hist_sina     —— 全球日线（新浪，symbol 用其内置代码）
#   index_global_hist_em       —— 全球日线（东财，需 em 域名可达；当前网络 em 被墙，
#                                   同步脚本会跳过并提示，em 可达后重跑即可自动补数）
# 数据源配置：data_catalog.yaml 的 index.hk / index.global 两个源（table=index_daily）。
# ---------------------------------------------------------------------------
global:
  # 港股（stock_hk_index_daily_sina）
  HSI:    {name: 恒生指数,               category: 跨境, sub_category: 港股, api_function: stock_hk_index_daily_sina}
  HSCEI:  {name: 恒生中国企业指数,       category: 跨境, sub_category: 港股, api_function: stock_hk_index_daily_sina}
  HSTECH: {name: 恒生科技指数,           category: 跨境, sub_category: 港股, api_function: stock_hk_index_daily_sina}
  # 亚太（index_global_hist_sina）
