[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berndata-client"
version = "0.1.0"
description = "本地 Bern_Financial_Data 金融数据中台 Python 客户端(薄封装 REST API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
df = ["pandas>=2.0"]

[project.urls]
Homepage = "https://127.0.0.1:8765/docs"

[tool.setuptools]
packages = ["berndata_client"]
